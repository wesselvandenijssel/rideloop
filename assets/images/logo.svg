<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none" aria-label="RideLoop">
  <!-- Loop icon: a circular arrow suggesting a round-trip route -->
  <g>
    <!-- Circle arc (the "loop") -->
    <circle cx="20" cy="20" r="12" stroke="#FF6B00" stroke-width="2.5" fill="none" stroke-dasharray="58 17" stroke-dashoffset="-4"/>
    <!-- Arrow head at end of arc -->
    <path d="M28.5 9.5 L32 13 L27.5 13.5" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Road / wheel dot -->
    <circle cx="20" cy="20" r="3" fill="#FF6B00"/>
  </g>

  <!-- Wordmark: "Ride" in white, "Loop" in orange -->
  <text x="44" y="26" font-family="Inter, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" letter-spacing="-0.5">Ride</text>
  <text x="83" y="26" font-family="Inter, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#FF6B00" letter-spacing="-0.5">Loop</text>
</svg>
